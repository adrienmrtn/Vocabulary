name: App Store screenshots

# Started by hand from the Actions tab. It draws the screenshots for every
# language the app teaches, keeps them as a downloadable artifact and, unless
# "upload" is unticked, replaces the screenshots of the version being prepared
# in App Store Connect. Nothing is submitted for review.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Send the screenshots to App Store Connect
        type: boolean
        default: true

concurrency: app-store-screenshots

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the browser
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
      - name: Draw the screenshots
        run: |
          python3 marketing/screenshots/build_data.py
          node marketing/screenshots/render.js
      - uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: fastlane/screenshots
      - uses: ruby/setup-ruby@v1
        if: inputs.upload
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Upload to App Store Connect
        if: inputs.upload
        run: bundle exec fastlane ios upload_screenshots
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
